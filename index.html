<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMate - Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light-grey d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <!-- Logo & Welcome -->
                        <div class="text-center mb-4">
                            <h2 class="text-navy fw-bold mb-1">
                                <i class="fa-solid fa-boxes-stacked me-2"></i>StockMate
                            </h2>
                            <p class="text-muted small">Welcome back! Please login to your account.</p>
                        </div>

                        <!-- Error Message Area (Hidden by default) -->
                        <div id="loginError" class="alert alert-danger d-none small" role="alert">
                            Invalid email or password.
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label small fw-medium">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="admin@stockmate.com" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label small fw-medium">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="fa-regular fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label small" for="rememberMe">Remember Me</label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-navy w-100 py-2 fw-medium">Login to Dashboard</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted" style="font-size: 0.7rem;">
                                *This website is for education purpose only. ID: admin@stockmate.com. Pass: Admin123.
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Load Default Data & Fail-Safe -->
    <script src="js/data.js"></script>
    
    <!-- Auth Logic -->
    <script src="js/auth.js"></script>
</body>
</html>

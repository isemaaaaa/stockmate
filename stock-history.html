<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMate - Stock History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="wrapper d-flex">
        <!-- LEFT SIDEBAR -->
        <aside id="sidebar" class="bg-navy text-white">
            <div class="sidebar-logo d-flex align-items-center justify-content-center py-4">
                <h3 class="fw-bold mb-0"><i class="fa-solid fa-boxes-stacked me-2"></i>StockMate</h3>
            </div>
            <ul class="nav flex-column sidebar-nav mt-3">
                <li class="nav-item"><a href="dashboard.html" class="nav-link active"><i class="fa-solid fa-chart-pie me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a href="products.html" class="nav-link"><i class="fa-solid fa-box me-2"></i> Products</a></li>
                <li class="nav-item"><a href="categories.html" class="nav-link"><i class="fa-solid fa-tags me-2"></i> Categories</a></li>
                <li class="nav-item"><a href="suppliers.html" class="nav-link"><i class="fa-solid fa-truck-field me-2"></i> Suppliers</a></li>
                <li class="nav-item"><a href="stock-in.html" class="nav-link"><i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Stock In</a></li>
                <li class="nav-item"><a href="stock-out.html" class="nav-link"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Stock Out</a></li>
                <li class="nav-item"><a href="stock-history.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left me-2"></i> Stock History</a></li>
                <li class="nav-item"><a href="reports.html" class="nav-link"><i class="fa-solid fa-file-invoice me-2"></i> Reports</a></li>
                <li class="nav-item"><a href="settings.html" class="nav-link"><i class="fa-solid fa-gear me-2"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer mt-auto p-3">
                <button id="logoutBtn" class="btn btn-outline-light w-100"><i class="fa-solid fa-sign-out-alt me-2"></i> Logout</button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="main-content flex-grow-1 bg-light-grey">
            <!-- TOP NAVIGATION -->
            <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3">
                <div class="d-flex align-items-center w-100">
                    <button class="btn btn-light d-lg-none me-3" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
                    <h4 class="mb-0 fw-bold text-navy page-title">Transaction History</h4>
                    
                    <div class="ms-auto d-flex align-items-center">
                        <div class="d-flex align-items-center">
                            <div class="me-2 text-end d-none d-md-block">
                                <p class="mb-0 fw-bold small" id="topNavName">Admin User</p>
                                <p class="mb-0 text-muted" style="font-size: 0.75rem;" id="topNavRole">Administrator</p>
                            </div>
                            <img src="https://ui-avatars.com/api/?name=Admin+User&background=172D4D&color=fff" alt="Profile" class="rounded-circle" width="40">
                        </div>
                    </div>
                </div>
            </nav>

            <!-- STOCK HISTORY CONTENT -->
            <div class="container-fluid p-4">
                
                <!-- Filter Controls -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label text-muted small fw-bold">Search Product or ID</label>
                                <input type="text" id="searchHistory" class="form-control" placeholder="Search...">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label text-muted small fw-bold">Transaction Type</label>
                                <select id="filterType" class="form-select">
                                    <option value="ALL">All Types</option>
                                    <option value="IN">Stock In Only</option>
                                    <option value="OUT">Stock Out Only</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-muted small fw-bold">From Date</label>
                                <input type="date" id="filterDateFrom" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-muted small fw-bold">To Date</label>
                                <input type="date" id="filterDateTo" class="form-control">
                            </div>
                            <div class="col-md-1">
                                <button class="btn btn-light w-100" onclick="resetFilters()" title="Reset Filters"><i class="fa-solid fa-rotate-right"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- History Table -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Date & Time</th>
                                        <th>Transaction ID</th>
                                        <th>Type</th>
                                        <th>Product</th>
                                        <th>Qty</th>
                                        <th>User</th>
                                        <th>Remarks</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTableBody">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap, Data, Global JS, then Page JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/stock-history.js"></script>
</body>
</html>

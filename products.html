<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMate - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="wrapper d-flex">
        <!-- LEFT SIDEBAR -->
        <aside id="sidebar" class="bg-navy text-white">
            <div class="sidebar-logo d-flex align-items-center justify-content-center py-4">
                <h3 class="fw-bold mb-0"><i class="fa-solid fa-boxes-stacked me-2"></i>StockMate</h3>
            </div>
            <ul class="nav flex-column sidebar-nav mt-3">
                <li class="nav-item"><a href="dashboard.html" class="nav-link active"><i class="fa-solid fa-chart-pie me-2"></i> Dashboard</a></li>
                <li class="nav-item"><a href="products.html" class="nav-link"><i class="fa-solid fa-box me-2"></i> Products</a></li>
                <li class="nav-item"><a href="categories.html" class="nav-link"><i class="fa-solid fa-tags me-2"></i> Categories</a></li>
                <li class="nav-item"><a href="suppliers.html" class="nav-link"><i class="fa-solid fa-truck-field me-2"></i> Suppliers</a></li>
                <li class="nav-item"><a href="stock-in.html" class="nav-link"><i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Stock In</a></li>
                <li class="nav-item"><a href="stock-out.html" class="nav-link"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Stock Out</a></li>
                <li class="nav-item"><a href="stock-history.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left me-2"></i> Stock History</a></li>
                <li class="nav-item"><a href="reports.html" class="nav-link"><i class="fa-solid fa-file-invoice me-2"></i> Reports</a></li>
                <li class="nav-item"><a href="settings.html" class="nav-link"><i class="fa-solid fa-gear me-2"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer mt-auto p-3">
                <button id="logoutBtn" class="btn btn-outline-light w-100"><i class="fa-solid fa-sign-out-alt me-2"></i> Logout</button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="main-content flex-grow-1 bg-light-grey">
            <!-- TOP NAVIGATION -->
            <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3">
                <div class="d-flex align-items-center w-100">
                    <button class="btn btn-light d-lg-none me-3" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
                    <h4 class="mb-0 fw-bold text-navy page-title">Product Management</h4>
                    
                    <div class="ms-auto d-flex align-items-center">
                        <div class="d-flex align-items-center">
                            <div class="me-2 text-end d-none d-md-block">
                                <p class="mb-0 fw-bold small" id="topNavName">Admin User</p>
                                <p class="mb-0 text-muted" style="font-size: 0.75rem;" id="topNavRole">Administrator</p>
                            </div>
                            <img src="https://ui-avatars.com/api/?name=Admin+User&background=172D4D&color=fff" alt="Profile" class="rounded-circle" width="40">
                        </div>
                    </div>
                </div>
            </nav>

            <!-- PRODUCTS CONTENT -->
            <div class="container-fluid p-4">
                
                <!-- Controls Row -->
                <div class="row g-3 mb-4 align-items-center">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-search text-muted"></i></span>
                            <input type="text" id="searchProduct" class="form-control border-start-0" placeholder="Search products...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select id="filterCategory" class="form-select">
                            <option value="">All Categories</option>
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="sortProduct" class="form-select">
                            <option value="name_asc">Sort by Name (A-Z)</option>
                            <option value="name_desc">Sort by Name (Z-A)</option>
                            <option value="price_high">Price (High to Low)</option>
                            <option value="price_low">Price (Low to High)</option>
                            <option value="qty_low">Quantity (Lowest First)</option>
                        </select>
                    </div>
                    <div class="col-md-2 text-end">
                        <button class="btn btn-navy w-100" onclick="openProductModal()"><i class="fa-solid fa-plus me-1"></i> Add Product</button>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">ID</th>
                                        <th>Product Name</th>
                                        <th>Category</th>
                                        <th>Supplier</th>
                                        <th>Selling Price</th>
                                        <th>Quantity</th>
                                        <th>Status</th>
                                        <th class="text-end pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="productTableBody">
                                    <!-- Populated by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="prodId">
                        
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Product Name</label>
                                <input type="text" id="prodName" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Category</label>
                                <select id="prodCategory" class="form-select" required></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Supplier</label>
                                <select id="prodSupplier" class="form-select" required></select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Description</label>
                                <textarea id="prodDesc" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Purchase Price (RM)</label>
                                <input type="number" id="prodBuy" class="form-control" step="0.01" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Selling Price (RM)</label>
                                <input type="number" id="prodSell" class="form-control" step="0.01" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Initial Quantity</label>
                                <input type="number" id="prodQty" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Minimum Stock Level</label>
                                <input type="number" id="prodMinQty" class="form-control" min="0" required>
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-navy">Save Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- View Product Modal -->
    <div class="modal fade" id="viewProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Product Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewProductContent">
                    <!-- Populated by JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap, Data, Global JS, then Page JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
